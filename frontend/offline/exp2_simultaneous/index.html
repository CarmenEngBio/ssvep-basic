<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SSVEP BCI — Experiment 2: Simultaneous Flickering</title>
  <link rel="stylesheet" href="./styles.css"/>
</head>
<body>

  <h1>SSVEP BCI - Simultaneous Flickering</h1>

  <div id="status">● Connecting with the server...</div>

  <!--<p id="instructions"> All cells are constantly flickering. Use an alarm to determine when the next cell will be gazed at
    each 40s and checking the displayed message at the screen for support with your timer.
    </p>-->

  <!--<div id="keypad">
    <div class="key" data-key="1" data-freq="8.57">1<small>8.57 Hz</small></div>
    <div class="key" data-key="2" data-freq="10">2<small>10 Hz</small></div>
    <div class="key" data-key="3" data-freq="12">3<small>12 Hz</small></div>
    <div class="key" data-key="4" data-freq="15">4<small>15 Hz</small></div>
  </div>-->

  <div id="keypad">
    <div class="key off" id="cell-1" data-key="1" data-freq="8.57">
      <div class="emoji">❄️</div>
      <div class="label">COLD</div>
    </div>
    <div class="key off" id="cell-2" data-key="2" data-freq="10.0">
      <div class="emoji">🔥</div>
      <div class="label">WARM</div>
    </div>
    <div class="key off" id="cell-3" data-key="3" data-freq="12.0">
      <div class="emoji">😣</div>
      <div class="label">PAIN</div>
    </div>
    <div class="key off" id="cell-4" data-key="4" data-freq="15.0">
      <div class="emoji">😴</div>
      <div class="label">TIRED</div>
    </div>
  </div>

  <div id="phase-label">—</div>

  <div id="test-panel">
    <button id="btn-test" onclick="startTest()">Begin experiment (160 s)</button>
    <div id="timer"></div>
  </div>

  <div id="rec-filename"></div>

  <script src="./ui.js"></script>
  <script src="./websocket.js"></script>
  <script src="./flicker.js"></script>
  <script src="./app.js"></script>

</body>
</html>
