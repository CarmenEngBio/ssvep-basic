<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BCI Asistencial SSVEP</title>
  <link rel="stylesheet" href="./assets/css/styles.css"/>
</head>
<body>
 
  <h1>BCI Asistencial SSVEP</h1>
  
  <div id="status">● Conectando con servidor...</div>
 
  <div id="keypad">
    <div class="key off" id="cell-1" data-key="1" data-freq="8.57">
      <div class="emoji">🍽️</div>
      <div class="label">Comer</div>
    </div>
    <div class="key off" id="cell-2" data-key="2" data-freq="10.0">
      <div class="emoji">❄️</div>
      <div class="label">Frío</div>
    </div>
    <div class="key off" id="cell-3" data-key="3" data-freq="12.0">
      <div class="emoji">🚨</div>
      <div class="label">SOS</div>
    </div>
    <div class="key off" id="cell-4" data-key="4" data-freq="15.0">
      <div class="emoji">🚽</div>
      <div class="label">Baño</div>
    </div>
  </div>
 
  <div id="phase-label">—</div>
 
  <div id="test-panel">
    <button id="btn-test" onclick="startTest()">Iniciar Sesión (10 s)</button>
    <div id="timer"></div>
  </div>
 
  <div id="rec-filename"></div>
 
  <script src="./assets/js/ui.js"></script>
  <script src="./assets/js/websocket.js"></script>
  <script src="./assets/js/flicker.js"></script>
  <script src="./assets/js/app.js"></script>
 
</body>
</html>
