<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSVEP 4-Symbol BCI — Testing</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }

    body {
      background: #0d0d0d;
      color: #ccc;
      font-family: 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 2rem;
      padding: 1rem;
    }

    h1 { 
      font-size: 1.3rem; 
      color: #999; 
      letter-spacing: 0.08em; 
      font-weight: 300;
      margin-top: 1rem;
    }

    /* ─────────────────────────────────────────────────────────────────── */
    /*  MAIN SYMBOL GRID (4 en cruz)                                        */
    /* ─────────────────────────────────────────────────────────────────── */

    #symbol-grid {
      position: relative;
      width: 500px;
      height: 500px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(20, 20, 20, 0.5);
      border: 1px solid #222;
      border-radius: 20px;
      padding: 20px;
    }

    .symbol-cell {
      position: absolute;
      width: 140px;
      height: 140px;
      background: #1a1a1a;
      border: 2px solid #333;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      transition: all 0.3s ease;
    }

    /* Posiciones en cruz (arriba, derecha, abajo, izquierda) */
    .symbol-cell[data-pos="top"] {
      top: 0;
      left: 50%;
      transform: translateX(-50%);
    }

    .symbol-cell[data-pos="right"] {
      top: 50%;
      right: 0;
      transform: translateY(-50%);
    }

    .symbol-cell[data-pos="bottom"] {
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
    }

    .symbol-cell[data-pos="left"] {
      top: 50%;
      left: 0;
      transform: translateY(-50%);
    }

    /* SÍMBOLO (parpadea) */
    .symbol-cell .emoji {
      font-size: 4.5rem;
      line-height: 1;
      transition: opacity 0.05s ease;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .symbol-cell.on .emoji {
      opacity: 1;           /* Visible */
      color: #fff;
    }

    .symbol-cell.off .emoji {
      opacity: 0.15;        /* Muy atenuado */
      color: #666;
    }

    /* ETIQUETA (no parpadea) */
    .symbol-cell .label {
      font-size: 0.85rem;
      color: #888;
      margin-top: 0.5rem;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .symbol-cell .freq-label {
      font-size: 0.7rem;
      color: #555;
      margin-top: 0.3rem;
      font-weight: 300;
    }

    /* HOVER effect (feedback visual) */
    .symbol-cell:hover {
      border-color: #555;
      background: #222;
    }

    /* PREDICCIÓN (borde verde cuando se predice) */
    .symbol-cell.predicted {
      border-color: #6abf69 !important;
      border-width: 3px !important;
      box-shadow: 0 0 12px rgba(106, 191, 105, 0.5), inset 0 0 8px rgba(106, 191, 105, 0.1);
      background: #1a1f1a;
    }

    /* ─────────────────────────────────────────────────────────────────── */
    /*  CONTROL PANEL                                                       */
    /* ─────────────────────────────────────────────────────────────────── */

    #control-panel {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 320px;
      padding: 1rem;
      background: #151515;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
    }

    .control-section {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .control-label {
      font-size: 0.75rem;
      color: #666;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    /* Frecuencias control */
    #freq-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
    }

    .freq-btn {
      padding: 0.6rem;
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      color: #ccc;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .freq-btn:hover {
      background: #333;
      border-color: #555;
    }

    .freq-btn.active {
      background: #1e281e;
      border-color: #4a7a49;
      color: #6abf69;
      box-shadow: 0 0 6px rgba(106, 191, 105, 0.3);
    }

    
  </style>
</head>
<body>

  <!-- TÍTULO -->
  <h1>🧠 SSVEP BCI — 4 Símbolos en Cruz</h1>

  <!-- GRID DE 4 SÍMBOLOS EN CRUZ -->
  <div id="symbol-grid">
    <!-- Arriba: Frío -->
    <div class="symbol-cell" data-pos="top" data-symbol-id="cold" data-freq="8.57">
      <div class="emoji">❄️</div>
      <div class="label">Frío</div>
      <div class="freq-label">8.57 Hz</div>
    </div>

    <!-- Derecha: Calor -->
    <div class="symbol-cell" data-pos="right" data-symbol-id="heat" data-freq="10.0">
      <div class="emoji">🔥</div>
      <div class="label">Calor</div>
      <div class="freq-label">10.0 Hz</div>
    </div>

    <!-- Abajo: Cansancio -->
    <div class="symbol-cell" data-pos="bottom" data-symbol-id="tired" data-freq="12.0">
      <div class="emoji">😴</div>
      <div class="label">Cansado</div>
      <div class="freq-label">12.0 Hz</div>
    </div>

    <!-- Izquierda: Dolor -->
    <div class="symbol-cell" data-pos="left" data-symbol-id="pain" data-freq="15.0">
      <div class="emoji">💢</div>
      <div class="label">Dolor</div>
      <div class="freq-label">15.0 Hz</div>
    </div>
  </div>

    <!-- Toggle flicker -->
    <div class="control-section">
      <button id="toggle-flicker" onclick="toggleFlicker()" 
              style="padding: 0.6rem; background: #2a2a2a; border: 1px solid #3a3a3a; 
                     border-radius: 6px; color: #ccc; cursor: pointer; font-size: 0.85rem;
                     font-weight: 500; transition: all 0.2s;">
        ▶️ Iniciar Parpadeo
      </button>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script>
    // ═══════════════════════════════════════════════════════════════════════════
    // CONFIGURACIÓN PRINCIPAL
    // ═══════════════════════════════════════════════════════════════════════════

    const CONFIG = {
      symbols: {
        cold:  { freq: 8.57,  label: 'Frío', emoji: '❄️', id: 'cold' },
        heat:  { freq: 10.0,  label: 'Calor', emoji: '🔥', id: 'heat' },
        tired: { freq: 12.0,  label: 'Cansado', emoji: '😴', id: 'tired' },
        pain:  { freq: 15.0,  label: 'Dolor', emoji: '💢', id: 'pain' },
      },
      flicker: {
        enabled: false,
        cycles: 0,
      }
    };

    // ═══════════════════════════════════════════════════════════════════════════
    // CLASE FLICKERER: Parpadeo por símbolo
    // ═══════════════════════════════════════════════════════════════════════════

    class SymbolFlickerer {
      constructor(cellEl, frequency) {
        this.cellEl = cellEl;
        this.frequency = frequency;
        this.period = 1000 / (frequency * 2);  // ms por medio ciclo
        this.elapsed = 0;
        this.state = false;
      }

      update(dt) {
        this.elapsed += dt;
        if (this.elapsed >= this.period) {
          this.elapsed -= this.period;
          this.state = !this.state;
          this.cellEl.classList.toggle('on', this.state);
          this.cellEl.classList.toggle('off', !this.state);
        }
      }

      reset() {
        this.elapsed = 0;
        this.state = false;
        this.cellEl.classList.remove('on');
        this.cellEl.classList.add('off');
      }
    }

    // ═══════════════════════════════════════════════════════════════════════════
    // CONTROL GLOBAL DE PARPADEO
    // ═══════════════════════════════════════════════════════════════════════════

    let flickerers = [];
    let lastTime = null;
    let flickerAnimationId = null;

    function initFlickerers() {
      flickerers = [];
      const cells = document.querySelectorAll('.symbol-cell');
      cells.forEach(cell => {
        const freq = parseFloat(cell.dataset.freq);
        flickerers.push(new SymbolFlickerer(cell, freq));
        cell.classList.add('off');
      });
    }

    function startFlicker() {
      if (flickerAnimationId !== null) return; // Ya está corriendo

      lastTime = null;
      CONFIG.flicker.enabled = true;
      CONFIG.flicker.cycles = 0;

      const animate = (currentTime) => {
        if (!lastTime) lastTime = currentTime;
        const dt = currentTime - lastTime;
        lastTime = currentTime;

        flickerers.forEach(f => f.update(dt));
        CONFIG.flicker.cycles++;

        updateDebugInfo();
        flickerAnimationId = requestAnimationFrame(animate);
      };

      flickerAnimationId = requestAnimationFrame(animate);
      updateControlUI();
    }

    function stopFlicker() {
      if (flickerAnimationId === null) return; // No está corriendo

      cancelAnimationFrame(flickerAnimationId);
      flickerAnimationId = null;
      lastTime = null;
      CONFIG.flicker.enabled = false;

      flickerers.forEach(f => f.reset());
      updateControlUI();
    }

    function toggleFlicker() {
      if (CONFIG.flicker.enabled) {
        stopFlicker();
      } else {
        startFlicker();
      }
    }

    // ═══════════════════════════════════════════════════════════════════════════
    // UI Y DEBUG
    // ═══════════════════════════════════════════════════════════════════════════

    function updateControlUI() {
      const btn = document.getElementById('toggle-flicker');
      if (CONFIG.flicker.enabled) {
        btn.textContent = '⏹️ Detener Parpadeo';
        btn.style.background = '#e05555';
        btn.style.borderColor = '#c04444';
        btn.style.color = '#fff';
      } else {
        btn.textContent = '▶️ Iniciar Parpadeo';
        btn.style.background = '#2a2a2a';
        btn.style.borderColor = '#3a3a3a';
        btn.style.color = '#ccc';
      }
    }

    function updateDebugInfo() {
      const debugEl = document.getElementById('debug-content');
      const flickerRate = (CONFIG.flicker.cycles / 100).toFixed(1); // Aproximado cada frame
      
      let html = `
        <div class="debug-line">Flicker: ${CONFIG.flicker.enabled ? '<span class="debug-active">ON</span>' : 'OFF'}</div>
        <div class="debug-line">Ciclos: ${CONFIG.flicker.cycles}</div>
        <div class="debug-line">Símbolos: 4</div>
      `;

      flickerers.forEach((f, i) => {
        const sym = Object.values(CONFIG.symbols)[i];
        const stateIcon = f.state ? '●' : '○';
        html += `<div class="debug-line">${sym.emoji} ${sym.freq}Hz: ${stateIcon}</div>`;
      });

      debugEl.innerHTML = html;
    }

    function closeModal() {
      document.getElementById('modal-overlay').style.display = 'none';
    }

    // ═══════════════════════════════════════════════════════════════════════════
    // INICIALIZACIÓN
    // ═══════════════════════════════════════════════════════════════════════════

    window.addEventListener('DOMContentLoaded', () => {
      initFlickerers();
      updateControlUI();
      
      // Status inicial
      const statusEl = document.getElementById('status-info');
      const statusText = document.getElementById('status-text');
      const statusDot = statusEl.querySelector('.status-dot');
      
      statusEl.classList.add('connected');
      statusText.textContent = 'Listo';
      statusDot.classList.add('ok');

      console.log('✓ Frontend inicializado. Símbolos listos.');
      console.log('Frecuencias:', Object.entries(CONFIG.symbols).map(([k, v]) => `${k}: ${v.freq}Hz`).join(', '));
    });

    // Auto-start para testing (opcional, descomenta si quieres)
    // window.addEventListener('load', () => { startFlicker(); });
  </script>

</body>
</html>
