<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSVEP 4-Symbol BCI — Testing</title>
  <link rel="stylesheet" href="./assets/css/symbol-styles.css">
  <style>
    
  </style>
</head>
<body>

  <!-- TÍTULO -->
  <h1>🧠 SSVEP BCI — 4 Símbolos en Cruz</h1>

  <div id="status">● Conectando con el servidor...</div>

  <!-- GRID DE 4 SÍMBOLOS EN CRUZ -->
  <div id="symbol-grid">
    <!-- Arriba: Frío -->
    <div class="symbol-cell" data-pos="top" data-symbol-id="cold" data-freq="8.57">
      <div class="emoji">❄️</div>
      <div class="label">Frío</div>
      <div class="freq-label">8.57 Hz</div>
    </div>

    <!-- Derecha: Calor -->
    <div class="symbol-cell" data-pos="right" data-symbol-id="heat" data-freq="10.0">
      <div class="emoji">🔥</div>
      <div class="label">Calor</div>
      <div class="freq-label">10.0 Hz</div>
    </div>

    <!-- Abajo: Cansancio -->
    <div class="symbol-cell" data-pos="bottom" data-symbol-id="tired" data-freq="12.0">
      <div class="emoji">😴</div>
      <div class="label">Cansado</div>
      <div class="freq-label">12.0 Hz</div>
    </div>

    <!-- Izquierda: Dolor -->
    <div class="symbol-cell" data-pos="left" data-symbol-id="pain" data-freq="15.0">
      <div class="emoji">💢</div>
      <div class="label">Dolor</div>
      <div class="freq-label">15.0 Hz</div>
    </div>
  </div>

  <div id="phase-label">—</div>

  <div id="test-panel">
    <button id="btn-test" onclick="startTest()">Iniciar experimento (160 s)</button>
    <div id="timer"></div>
  </div>

  <div id="rec-filename"></div>

  <!-- SCRIPTS -->
  <script src="./assets/js/symbol-flicker.js"></script>
  <script src="./assets/js/symbol-ui.js"></script>
  <script src="./assets/js/symbol-websocket.js"></script>
  <script src="./assets/js/symbol-app.js"></script>

</body>
</html>
